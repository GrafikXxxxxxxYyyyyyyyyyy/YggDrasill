name: CI

on:
  push:
    branches:
      - main
      - master
      - auto_model_coding
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,yaml]"

      - name: Lint
        run: ruff check .

      - name: Run core test suite
        run: pytest tests/foundation tests/engine tests/hypergraph tests/workflow tests/test_domain_scenarios.py tests/test_package_api.py

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tool
        run: python -m pip install --upgrade pip && python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Install built wheel
        run: python -m pip install dist/*.whl

  diffusion-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install diffusion dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,yaml,diffusion]"

      - name: Run diffusion smoke tests
        run: pytest tests/diffusion/test_registry.py tests/diffusion/test_ergonomic_api.py tests/diffusion/test_flux_graphs.py tests/diffusion/test_builder_scheduler_replace.py tests/diffusion/test_run_diffusion_ip_scale_once.py tests/diffusion/test_ip_adapter_precomputed_embeds.py
